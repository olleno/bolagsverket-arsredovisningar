name: lista-uppgiftsnamn
# Engångsjobb för hand: vilka uppgifter finns i noterna? Laddar ner EN bulkfil och sparar bara namnlistan.
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  B: https://vardefulla-datamangder.bolagsverket.se
jobs:
  lista:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -gsS --retry 5 --retry-all-errors "$B/arsredovisningar-bulkfiler?prefix=arsredovisningar/2024/&delimiter=%5C" -o l.xml
          key=$(grep -oE '<Key>[^<]+</Key>' l.xml | sed 's/<[^>]*>//g' | grep '/2024/2' | head -1)
          echo "fil: $key"
          curl -sSL --retry 5 --retry-all-errors -o del.zip "$B/arsredovisningar-bulkfiler/$key"
          mkdir -p data/meta && python3 namn_i_ar.py del.zip data/meta/uppgiftsnamn_2024.txt
          git config user.name hamtning-bot; git config user.email bot@users.noreply.github.com
          git add data/meta; git commit -m "Uppgiftsnamn i en bulkfil 2024"; git pull --rebase -q; git push
