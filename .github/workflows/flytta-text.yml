name: flytta-text
# Lägger en tidigare textartefakt i repot, krypterad med mottagarens publika nyckel.
# Bara den som har den privata nyckeln (som inte finns här) kan läsa den.
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
permissions:
  contents: write
  actions: read
jobs:
  f:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: texter
          path: texter
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          tar czf t.tgz texter
          openssl rand -hex 32 > k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in t.tgz -out krypterat/texter.tgz.enc -pass file:k
          openssl pkeyutl -encrypt -pubin -inkey krypterat/mottagare.pub.pem -pkeyopt rsa_padding_mode:oaep -in k -out krypterat/nyckel.enc
          rm -f k t.tgz
          git config user.name obduktion-bot; git config user.email bot@users.noreply.github.com
          git add krypterat; git commit -m "Krypterade texter"; for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
